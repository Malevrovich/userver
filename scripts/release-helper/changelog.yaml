repo:
  owner: userver-framework
  name: userver
  github_url: https://github.com/userver-framework/userver
  local_path: ../..

range:
  from: HEAD~20  # T1 - config
  to: HEAD

thresholds:
  small_commit: 50
  bugfix_skip: 200

llm:
  batch_size: 20
  max_prompt_chars: 50000
  backend: http_api   # http_api (default) | fake
  include_diff: true  # attach bounded git-show diff to each commit context (http_api only)
  max_rps: 5          # target requests per second (0 = unlimited)
  max_concurrency: 4  # max parallel LLM requests (default: 1)
  # model: gpt-4o-mini  # provider/model string; uses CHANGELOG_LLM_MODEL env var if unset
  # diff_max_chars: 20000
  #
  # Parallelism:
  #
  # Credentials (or use CLI flags --llm-api-key / --llm-base-url / --llm-model):
  #   CHANGELOG_LLM_API_KEY   — API key (required)
  #   CHANGELOG_LLM_BASE_URL  — base URL of the API endpoint
  #   CHANGELOG_LLM_MODEL     — model override (optional, overrides llm.model above)

core_team:
  emails:
    - ivan-skryabin@yandex-team.com
    - dddccc20000@mail.ru
    - antonyzhilin@userver.tech

output:
  workdir: .changelog
