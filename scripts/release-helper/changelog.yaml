repo:
  owner: userver-framework
  name: userver
  github_url: https://github.com/userver-framework/userver
  local_path: ../..

range:
  from: v3.0.0
  to: HEAD

thresholds:
  small_commit: 50
  bugfix_skip: 200

llm:
  backend: http_api
  batch_size: 20
  max_prompt_chars: 50000
  max_rps: 5.0          # Target requests per second (0 = unlimited)
  max_concurrency: 5    # Max concurrent LLM requests
  max_429_retries: 5    # How many times to retry on 429 Rate Limit

core_team:
  email_regexes:
    - "@yandex-team\\.(com|ru)$"
    - "dddccc20000@mail\\.ru$"
    - "antonyzhilin@userver\\.tech$"

output:
  workdir: .changelog
